name: Build Android APK (Musik Klona)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile-app/package-lock.json'

      - name: 📦 Install Root & Mobile Dependencies
        run: |
          npm install
          cd mobile-app
          npm install

      - name: ⚙️ Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 📝 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 🛠️ Generate Android Native Project (Expo Prebuild)
        working-directory: ./mobile-app
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 🚀 Compile APK (Assemble Debug APK Siap Install)
        working-directory: ./mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: 📤 Upload APK Artifact ke GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MusikKlona-Android-APK
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 🏷️ Buat GitHub Release (Jika menggunakan Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

