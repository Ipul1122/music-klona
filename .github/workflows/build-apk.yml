name: Build Android APK (Musik Klona)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile-app/package-lock.json'

      - name: 📦 Install Root & Mobile Dependencies
        run: |
          npm install
          cd mobile-app
          npm install

      - name: ⚙️ Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 📝 Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 🛠️ Generate Android Native Project (Expo Prebuild)
        working-directory: ./mobile-app
        run: |
          npx expo prebuild --platform android --clean --no-install
          # Menggunakan Gradle 8.10.2 (versi resmi standar React Native 0.76) untuk mencegah error Kotlin metadata Gradle 9
          sed -i 's/gradle-9.*-bin.zip/gradle-8.10.2-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          echo "android.kotlinVersion=1.9.24" >> android/gradle.properties

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: 🚀 Compile APK (Assemble Debug APK Siap Install)
        working-directory: ./mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --no-daemon --stacktrace -x lint

      - name: 📤 Upload APK Artifact ke GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MusikKlona-Android-APK
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 🏷️ Buat GitHub Release (Jika menggunakan Git Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

